name: Godot checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style-check:
    name: GDScript naming conventions
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install linter
        run: python -m pip install "gdtoolkit==4.5.0"

      - name: Check GDScript naming
        run: gdlint scripts

      - name: Check script filenames
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          invalid_paths = [
              path
              for path in sorted(Path("scripts").rglob("*.gd"))
              if re.fullmatch(r"(?:[A-Z][a-z0-9]*)+", path.stem) is None
          ]

          for path in invalid_paths:
              print(f"::error file={path}::Script filenames must use PascalCase.")

          raise SystemExit(bool(invalid_paths))
          PY

  godot-check:
    name: Godot syntax and startup
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    container:
      image: barichello/godot-ci:4.7.2

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Linux font dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends fontconfig fonts-dejavu-core

      - name: Import, check scripts, and start main scene
        run: |
          set -euo pipefail

          run_godot() {
            local log_file="$RUNNER_TEMP/godot-check.log"

            godot --headless --path . "$@" 2>&1 | tee "$log_file"

            if grep -Eq '(SCRIPT ERROR|ERROR):' "$log_file"; then
              echo "::error::Godot reported errors; see the output above."
              exit 1
            fi
          }

          echo "::group::Import assets"
          run_godot --import
          echo "::endgroup::"

          while IFS= read -r -d '' script; do
            echo "::group::Check $script"
            run_godot --check-only --script "res://$script"
            echo "::endgroup::"
          done < <(find scripts -type f -name '*.gd' -print0)

          echo "::group::Start main scene"
          run_godot --fixed-fps 60 --quit-after 120
          echo "::endgroup::"
